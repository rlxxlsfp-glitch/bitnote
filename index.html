<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A7BC8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bitnote">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<title>bitnote · 정보 기말 대비</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{--bg:#FFFFFF;--soft:#F5F4FB;--soft2:#E8EFFA;--line:#E8E6F2;--ink:#1B1C24;--sub:#6E7080;--pri:#4A7BC8;--pri2:#7FA4DE;--deep:#345C9C;--hl:#FFE38A;--hlink:#1B1C24;--good:#1F9D68;--bad:#E5484D;--badsoft:#FDECEC;--warn:#F4EEE5;--warnbar:#C58A2A;color-scheme:light;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111117;--soft:#1B1A24;--soft2:#1E2A3D;--line:#2C2A3B;--ink:#ECEBF4;--sub:#9C9AB0;--pri:#86AEEA;--pri2:#A9C4EE;--deep:#2A4878;--hl:rgba(255,214,90,.32);--hlink:#ECEBF4;--good:#4CC995;--bad:#FF7B7F;--badsoft:#3A1E22;--warn:#2B2519;--warnbar:#E0A949;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111117;--soft:#1B1A24;--soft2:#1E2A3D;--line:#2C2A3B;--ink:#ECEBF4;--sub:#9C9AB0;--pri:#86AEEA;--pri2:#A9C4EE;--deep:#2A4878;--hl:rgba(255,214,90,.32);--hlink:#ECEBF4;--good:#4CC995;--bad:#FF7B7F;--badsoft:#3A1E22;--warn:#2B2519;--warnbar:#E0A949;color-scheme:dark}
:root[data-fs="l"]{font-size:16.5px} :root[data-fs="xl"]{font-size:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:1rem;line-height:1.6;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button:disabled{cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.45rem;color:var(--pri);letter-spacing:-.03em}
.pill{display:flex;align-items:center;gap:6px;background:var(--soft2);color:var(--pri);font-weight:800;border-radius:999px;padding:7px 14px;font-size:.95rem}
main{max-width:760px;margin:0 auto;padding:22px 18px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--sub);font-size:.75rem}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar svg{width:24px;height:24px}
body.playing .tabbar,body.playing .top{display:none}
h1.t{font-size:1.75rem;font-weight:800;letter-spacing:-.035em;margin:0}
.st{color:var(--sub);margin:4px 0 22px}
.crumb{color:var(--sub);font-size:.95rem;margin-bottom:12px;display:inline-block}
.hero{background:var(--deep);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}
.hero small{opacity:.75;font-size:.85rem}
.hero .big{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.hero p{margin:2px 0 14px;opacity:.75}
.hero button{background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-radius:999px;padding:9px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--soft);border-radius:18px;padding:16px;text-align:left;width:100%}
.tile b{display:block;font-size:1.08rem;margin-bottom:2px}
.tile span{color:var(--sub);font-size:.9rem}
.tile.on{background:var(--soft2)}
.tile.on b{color:var(--pri)}
.sec{font-weight:800;margin:26px 0 10px;font-size:1rem}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:5px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px 0;border-radius:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(30,45,70,.08)}
.seg.p button.on{background:var(--soft2);color:var(--pri);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--soft);border-radius:999px;padding:7px 15px;font-weight:600;color:var(--sub);font-size:.93rem}
.chip.on{background:var(--soft2);color:var(--pri)}
.chip:disabled{opacity:.35}
.card{background:var(--soft);border-radius:18px;padding:18px;margin-bottom:10px}
.card.w{background:var(--bg);border:1px solid var(--line)}
.prow{display:block;width:100%;text-align:left;background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.prow b{font-size:1.08rem}
.prow .m{color:var(--sub);font-size:.88rem;margin-top:2px}
.prow .g{font-size:.92rem;margin-top:6px}
.gbtn{display:block;width:100%;text-align:center;color:#fff;font-weight:800;border-radius:999px;padding:14px;background:linear-gradient(90deg,#3F6DB5,#7FA4DE);box-shadow:0 8px 22px rgba(63,109,181,.28)}
.gbtn:disabled{opacity:.45;box-shadow:none}
.obtn{display:block;width:100%;text-align:center;font-weight:700;border-radius:999px;padding:13px;border:1px solid var(--line);background:var(--bg)}
.ttl{display:flex;align-items:center;gap:10px}
.ttl svg{width:26px;height:26px;color:var(--pri);flex:none}
/* note */
.sumh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;margin:6px 0 10px}
.sumh::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--pri)}
ul.sum{margin:0 0 8px;padding-left:20px}
ul.sum li{margin:5px 0}
.nh{display:flex;align-items:center;gap:12px;margin:34px 0 12px}
.nh i{font-style:normal;background:var(--pri);color:#fff;font-weight:800;font-size:.85rem;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.nh h2{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:-.03em}
mark{background:var(--hl);color:var(--hlink);border-radius:3px;padding:0 2px}
.tip{background:var(--soft2);border-left:4px solid var(--pri);border-radius:0 14px 14px 0;padding:13px 16px;margin:12px 0}
.warn{background:var(--warn);border-left:4px solid var(--warnbar);border-radius:0 14px 14px 0;padding:13px 16px;margin:12px 0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:.93rem}
th{background:var(--soft);text-align:left;font-weight:700;color:var(--sub);padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
td:last-child{border-right:0} tr:last-child td{border-bottom:0}
.en{font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-size:1.08em;line-height:1.75;letter-spacing:0}
.x{color:var(--bad);text-decoration:line-through}
.okc{color:var(--good);font-weight:700}
.sent{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--soft2);color:var(--pri);font:700 .75rem system-ui;margin-right:8px;vertical-align:2px}
.sent .ko{display:none;color:var(--pri);margin-top:5px;font-size:.95rem;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
.sent.open .ko,.showko .sent .ko{display:block}
.flow{display:flex;flex-direction:column}
.node{background:var(--soft);border-radius:14px;padding:12px 15px}
.node small{display:block;font-weight:800;color:var(--pri);font-size:.82rem}
.node.k{background:var(--soft2);outline:1.5px solid var(--pri)}
.arr{height:22px;display:flex;justify-content:center}
.arr::before{content:"";width:2px;background:var(--pri);opacity:.5}
.chk{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.chk .q{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.chk .q em{font-style:normal;color:var(--pri);margin-right:6px}
.chk .q small{color:var(--sub);font-weight:500;white-space:nowrap}
.chk .a{display:none;margin-top:8px;color:var(--sub);font-size:.94rem}
.chk.open .a{display:block}
/* setup */
.lab{font-weight:700;color:var(--sub);margin:20px 0 8px;font-size:.95rem}
.cb{display:inline-flex;align-items:center;gap:8px;margin:0 14px 10px 0;font-weight:600}
.cb i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.cb.on i{background:var(--pri);border-color:var(--pri)}
.cb.on i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.est{display:flex;justify-content:space-between;background:var(--soft);border-radius:14px;padding:14px 16px;margin:20px 0 14px;color:var(--sub)}
.est b{color:var(--pri)}
/* player */
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.ptop .in{max-width:760px;margin:0 auto;padding:10px 18px 12px}
.ptop .r{display:flex;align-items:center;gap:12px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ptop b{display:block;font-size:1.15rem}
.ptop small{color:var(--sub)}
.pbar{height:6px;background:var(--soft2);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3F6DB5,#7FA4DE);transition:width .3s}
.qhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.qhead .no{color:var(--pri);font-weight:800;font-size:1.25rem}
.qhead .tg{background:var(--soft);color:var(--sub);font-size:.82rem;padding:3px 10px;border-radius:6px}
.qhead .fr{margin-left:auto;color:var(--sub);font-size:.82rem}
.qt{font-weight:700;font-size:1.06rem;margin-bottom:14px}
.given{border:1.5px solid var(--ink);border-radius:4px;padding:11px 13px;margin-bottom:14px}
.body{margin-bottom:16px}
.mk{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.mk b{font-family:system-ui,sans-serif;font-size:.82em;color:var(--pri);margin-right:2px}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--ink);text-decoration:none}
.box{text-decoration:none;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.opt .c{color:var(--pri);font-weight:700;flex:none}
.opt.sel{border-color:var(--pri);background:var(--soft2)}
.opt.sel .rd{border-color:var(--pri)} .opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--bg))}
.opt.no{border-color:var(--bad);background:var(--badsoft)}
.opt.cut{opacity:.4} .opt.cut .tx{text-decoration:line-through}
.hintb{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--soft2);background:var(--soft2);color:var(--pri);font-weight:700;border-radius:999px;padding:9px 16px;margin-top:14px}
.hbox{background:var(--soft2);border-radius:16px;padding:14px 16px;margin-top:12px}
.hbox b{color:var(--pri);display:block;font-size:.92rem}
.exp{margin-top:16px;border-radius:16px;padding:16px;background:var(--soft)}
.exp .res{font-weight:800;font-size:1.1rem;margin-bottom:6px}
.exp .res.ok{color:var(--good)} .exp .res.no{color:var(--bad)}
.exp ul{padding-left:18px;margin:6px 0}
.exp .okw{color:var(--good);font-weight:700}
.exp .sub{font-weight:700;margin-top:10px}
.kol{color:var(--sub);font-size:.93rem;margin:6px 0 0}
details{margin-top:10px} summary{color:var(--pri);font-weight:700;cursor:pointer}
.pfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.pfoot .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.pfoot .obtn{flex:1;padding:12px}
.pfoot .gbtn{flex:1.3;padding:12px}
.pfoot span{color:var(--sub);font-size:.92rem;white-space:nowrap}
.score{font-size:3.4rem;font-weight:800;color:var(--pri);letter-spacing:-.04em;text-align:center}
.empty{text-align:center;color:var(--sub);padding:50px 10px}
.empty b{color:var(--ink);display:block;font-size:1.1rem;margin-bottom:4px}
.tf{list-style:none;padding:0;margin:0} .tf li{padding:3px 0}
.row{display:flex;gap:10px;align-items:center}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--pri)} .sw.on::after{left:24px}

h1.t{font-size:1.6rem}
.logo{position:relative}
.logo .spk{font-size:.7em;margin-left:2px;display:inline-block;vertical-align:top;animation:tw 2.4s ease-in-out infinite}
.spk2{display:inline-block;animation:tw 2.4s ease-in-out infinite .6s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.gbtn{position:relative;overflow:hidden;isolation:isolate}
.gbtn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%) skewX(-18deg);animation:sheen 4s ease-in-out infinite;z-index:-1;will-change:transform}
.gbtn:disabled::after{display:none}
@keyframes sheen{0%,62%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#3F6DB5 0%,#345C9C 55%,#5F8ED6 100%)}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero .st2{position:absolute;color:#fff;pointer-events:none;animation:tw 2.8s ease-in-out infinite}
.hero > *{position:relative}
.spark{position:fixed;pointer-events:none;z-index:70;font-size:18px;color:#FFC93C;text-shadow:0 0 8px rgba(255,201,60,.8);animation:burst .95s ease-out forwards}
.spark.v{color:#86A9E3;text-shadow:0 0 8px rgba(120,160,230,.9)}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(120deg);opacity:0}}
.opt.ok{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 14%,transparent)}
.scrim{position:fixed;inset:0;background:rgba(12,18,32,.38);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--bg);z-index:41;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;overflow-y:auto;transform:translateX(100%);transition:transform .28s ease}
.drawer.on{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer .hd b{font-size:1.25rem}
.srch{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:11px 16px;margin-bottom:12px}
.srch input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0}
.prof{display:flex;align-items:center;gap:12px;background:var(--soft2);border-radius:18px;padding:14px}
.prof .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4A7BC8,#7FA4DE);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.prof small{color:var(--pri);display:block}
.prof .pill{margin-left:auto;background:var(--bg)}
.dsec{color:var(--sub);font-size:.85rem;margin:20px 0 6px;padding-left:4px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border-radius:12px;font-size:1.02rem}
.ditem svg{width:22px;height:22px;color:var(--ink)}
.ditem:active{background:var(--soft)}
.days{display:flex;justify-content:space-between;margin:18px 0 26px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:.85rem}
.day i{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;color:#fff}
.day.today i{background:var(--bg);border:2px dashed var(--pri);color:var(--pri)}
.day.today{color:var(--ink);font-weight:700}
.day.done i{background:linear-gradient(135deg,#4A7BC8,#7FA4DE);border:0;color:#fff;box-shadow:0 4px 12px rgba(63,109,181,.35)}
.qrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.qrow .ic{width:46px;height:46px;border-radius:50%;background:var(--soft2);color:var(--pri);display:grid;place-items:center;flex:none}
.qrow .ic svg{width:22px;height:22px}
.qrow b{display:block}
.qrow small{color:var(--sub)}
.qrow .pt{margin-left:auto;color:var(--pri);font-weight:800}
.qrow.ok .ic{background:linear-gradient(135deg,#4A7BC8,#7FA4DE);color:#fff}
.qbar{height:5px;background:var(--soft2);border-radius:3px;margin-top:5px;overflow:hidden;width:min(220px,50vw)}
.qbar i{display:block;height:100%;background:var(--pri)}
.empty2{border:1px solid var(--line);border-radius:18px;padding:34px 18px;text-align:center}
.empty2 .ico{color:var(--pri);margin-bottom:8px}
.empty2 b{display:block}
.empty2 p{color:var(--sub);font-size:.92rem;margin:4px 0 16px}
.empty2 .row{justify-content:center;flex-wrap:wrap}
.sm{width:auto!important;display:inline-block!important;padding:10px 20px!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:#23324A;color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;z-index:80;opacity:0;transition:all .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .3s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .lg{position:relative;isolation:isolate;font-size:3rem;font-weight:800;color:var(--pri);letter-spacing:-.04em}
.splash .lg::before{content:"";position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(74,123,200,.30),transparent 62%);z-index:-1;animation:breathe 1.6s ease-in-out infinite}
.splash .lb{width:150px;height:4px;background:var(--soft2);border-radius:2px;overflow:hidden}
.splash .lb i{display:block;height:100%;width:6%;background:linear-gradient(90deg,#4A7BC8,#7FA4DE);border-radius:2px;animation:load var(--d,.5s) ease-out forwards}

 s+=bx(x[0],y,w,h,A[0],A[1],A[2])+bx(x[1],y,w,h,B[0],B[1],B[2])+bx(x[2],y,w,h,C[0],C[1],C[2]);
 [[x[0]+w,x[1],l1],[x[1]+w,x[2],l2]].forEach(([a,b,l])=>{s+=`<line x1="${a+2}" y1="${y+h/2}" x2="${b-3}" y2="${y+h/2}" class="ln" marker-end="url(#ah)"/><text x="${(a+b)/2}" y="${y-10}" text-anchor="middle" class="s">${l}</text>`});
 let H=y+h+10;
 if(o.keys){[x[0]+w+g/2,x[1]+w+g/2].forEach(cx=>{s+=`<rect x="${cx-22}" y="${y+h+26}" width="44" height="28" rx="7" class="bw"/><text x="${cx}" y="${y+h+40}" text-anchor="middle" dominant-baseline="central" class="tb">키</text><line x1="${cx}" y1="${y+h+24}" x2="${cx}" y2="${y+h/2+6}" class="ln" marker-end="url(#ah)"/>`});H=y+h+64}
 if(o.back){const yy=y+h+24;s+=`<path d="M${x[2]+w/2} ${y+h+2} L${x[2]+w/2} ${yy} L${x[0]+w/2} ${yy} L${x[0]+w/2} ${y+h+6}" class="lnb" marker-end="url(#ah)"/><rect x="${(x[0]+x[2]+w)/2-70}" y="${yy+10}" width="140" height="28" rx="7" class="br"/><text x="${(x[0]+x[2]+w)/2}" y="${yy+24}" text-anchor="middle" dominant-baseline="central" class="tb">${o.back}</text>`;H=yy+48}
 return svgW(2+3*w+2*g+2,H,s,`${A[0]}에서 ${C[0]}까지의 흐름`)}
/* 송신자-수신자 그림 */
function ab(t,aS,bS,ka,kb){const W=350;let s=`<text x="2" y="14" class="tb">${t}</text>`;
 s+=bx(2,26,124,52,'A (송신자)',aS,'bx')+bx(224,26,124,52,'B (수신자)',bS,'bx');
 s+=`<line x1="130" y1="52" x2="220" y2="52" class="ln" marker-end="url(#ah)"/><text x="175" y="42" text-anchor="middle" class="s">암호문 전송</text>`;
 if(kb){s+=bx(2,92,124,46,ka[0],ka[1],ka[2])+bx(224,92,124,46,kb[0],kb[1],kb[2])}else{s+=bx(85,92,180,40,ka[0],ka[1],ka[2])}
 return svgW(W,146,s,t)}
/* 허프만 트리: 잎은 문자열, 가지는 {v,c:[왼,오],e:[왼 번호,오 번호]} */
function tree(root,cap){const nl=n=>typeof n==='string'?1:nl(n.c[0])+nl(n.c[1]);const sp=Math.min(54,Math.floor(344/nl(root))),bw=Math.min(46,sp-6),D=60,bh=30;let leaves=0,maxd=0;
 function lay(n,d){maxd=Math.max(maxd,d);if(typeof n==='string'){const o={v:n,leaf:1,x:leaves*sp+sp/2,d};leaves++;return o}const L=lay(n.c[0],d+1),R=lay(n.c[1],d+1);return{v:n.v,e:n.e,c:[L,R],x:(L.x+R.x)/2,d}}
 const r=lay(root,0);const W=Math.max(leaves*sp,200)+4,H=maxd*D+bh+14;let s='',t='';
 (function draw(n){const y=6+n.d*D;if(n.c){n.c.forEach((c,i)=>{const cy=6+c.d*D;s+=`<line x1="${n.x+2}" y1="${y+bh}" x2="${c.x+2}" y2="${cy}" class="ln"/>`;const mx=(n.x+c.x)/2+2,my=(y+bh+cy)/2;t+=`<text x="${mx+(i?9:-9)}" y="${my-2}" text-anchor="middle" dominant-baseline="central" class="lb">${n.e[i]}</text>`;draw(c)})}
  s+=`<rect x="${n.x+2-bw/2}" y="${y}" width="${bw}" height="${bh}" rx="8" class="${n.leaf?'bp':'bx'}"/><text x="${n.x+2}" y="${y+bh/2}" text-anchor="middle" dominant-baseline="central" class="tb">${n.v}</text>`})(r);
 return svgW(W,H,s+t,cap||'허프만 트리')}

function pixPic(){const o=[20,35,50,65,30,45,60,75,40,55,70,85,50,65,80,95];const avg=(i)=>{const r=Math.floor(i/4),c=i%4,R=r-r%2,C=c-c%2;return(o[R*4+C]+o[R*4+C+1]+o[(R+1)*4+C]+o[(R+1)*4+C+1])/4};
 const g=f=>`<div class="pix">${o.map((v,i)=>`<i style="background:color-mix(in srgb,var(--pri) ${f(i)}%,var(--bg))"></i>`).join('')}</div>`;
 return `<div class="pcmp"><div><b>원본 사진</b>${g(i=>o[i])}</div><span class="pa">›</span><div><b>비손실 복원</b>${g(i=>o[i])}<small>원본과 똑같음</small></div><span class="pa">/</span><div><b>손실 복원</b>${g(avg)}<small>뭉개짐 (정보 버림)</small></div></div>`}

 s+=txt(4+8*30+8,28,'파랑 × 16','tb','start')+txt(4+8*30+8,76,'흰색 × 16','tb','start');return svgW(348,104,s,'공간적 중복성 예시')}

${star('손실 예시 <b>JPEG, MP3, MPEG4</b> / 비손실 예시 <b>ZIP, PNG, GIF</b>를 섞어서 "손실끼리 짝지은 것은?"으로 잘 나와요. "압축하면 품질이 좋아진다" 같은 선지는 무조건 틀린 거예요.')}`},
{id:'1-4',t:'압축의 원리: 중복성과 압축률',h:`
<p>자, 이게 압축의 핵심이에요. 딱 한 마디. <mark>반복되는 건 한 번만 저장하자.</mark> 이걸 <b>중복성 제거</b>라고 해요.</p>
<div class="sumh">① 공간적 중복성: 위치에 따라 반복</div>
${spacePic()}
<p>하늘 사진을 생각해 보세요. 위쪽은 파란 칸이 쭉, 아래쪽은 흰 칸이 쭉 이어지죠. 파란색 16번을 다 적지 말고 "파랑 × 16"이라고 한 번만 쓰면 확 줄어요.</p>
<div class="sumh">② 시간적 중복성: 시간에 따라 반복</div>
${timePic()}
<p>동영상은 사진(프레임)을 빠르게 넘기는 거예요. 장면마다 배경은 그대로고 공만 움직이죠? 그러니까 배경은 한 번만 저장하고 <b>바뀐 부분만</b> 저장해요.</p>
${star('"한 장 안에서 반복" = 공간적, "장면이 바뀌어도 반복" = 시간적. 사진 예시면 공간, 동영상 예시면 시간이에요.')}
<div class="sumh">압축률</div>
<p class="fl">압축률 = ${frac('압축 전 용량','압축 후 용량')}</p>
<ul class="sum"><li><b>1보다 크면</b> 줄어든 것 → 클수록 좋아요.</li><li>1이면 그대로, <b>1보다 작으면 오히려 늘어난</b> 거예요.</li></ul>
<div class="card">예) 200KB → 50KB면 압축률 = ${frac(200,50)} = <b>4</b></div>
<p>압축이 잘 됐는지는 <b>용량이 얼마나 줄었나</b> + <b>품질이 얼마나 유지됐나</b>로 판단해요.</p>
${star('분자, 분모 거꾸로 쓰는 실수 조심! "압축 <b>전</b>이 위". 압축률 0.5는 "절반으로 줄었다"가 아니라 "2배로 늘었다"예요.')}`},
{id:'1-5',t:'문자 코드: 아스키와 유니코드',h:`
<p>글자도 결국 0과 1이에요. 어떻게? 글자마다 <mark>번호(코드)</mark>를 정해 둔 표가 있거든요. 그게 <b>코드표</b>예요.</p>
<div class="sumh">아스키코드: A = 65</div>
<p>대문자 A는 65번이에요. 이걸 2진수로 바꾸면 이렇게 돼요.</p>
${divPic()}
<p>아스키코드는 글자 하나를 <b>7비트</b>로 표현해요. (앞의 비트 그림에서 8칸 중 맨 앞 0을 빼면 1000001이죠.)</p>
<div class="tip"><b>응용</b> A가 65니까 B 66, C 67, D 68. D = 64 + 4 = <b>1000100</b>이에요.</div>
<div class="sumh">유니코드: 전 세계 공용 코드표</div>
<p>나라마다 코드표가 다르면? 우리나라에서 "가"라고 저장한 번호를 다른 나라 컴퓨터가 엉뚱한 글자로 읽어요. 그래서 <b>글자가 깨지는</b> 거예요.</p>
<p>이걸 막으려고 <b>전 세계 문자를 하나의 표로</b> 만든 국제 표준이 <b>유니코드</b>(UTF-8, UTF-16)예요.</p>
${star('A = 65 = <b>1000001</b> (7비트). 글자가 깨지는 이유 = <b>문자 코드 체계가 달라서</b>.')}`},
{id:'1-6',t:'반복 길이 압축',h:`
<p>여기부터는 선생님이 <b>정확하게 이해하라</b>고 하신 부분이에요. 집중!</p>
<p>방법은 단순해요. 같은 글자가 줄줄이 나오면 <mark>글자 + 몇 번</mark>으로 쓰는 거예요.</p>
<div class="tip"><b>비유</b> "ㅋㅋㅋㅋㅋㅋㅋㅋ"를 "ㅋ×8"로 쓰는 거예요.</div>
<p class="cap">원본 19글자</p>${cells('RRRRRAAAAGGGRRRRRGG',rag)}
<p class="cap">압축 결과 10글자</p>${cells('R5A4G3R5G2',ch=>({R:'c1',A:'c2',G:'c3'}[ch]||'cn'))}
<p class="fl">압축률 = ${frac(19,10)} = 1.9</p>
<div class="warn"><b>함정</b> R이 앞에 5개, 뒤에 5개 있다고 R10으로 합치면 안 돼요! <b>연속</b>된 것만 묶어요. 그래서 R5 … R5로 따로 써요.</div>
<div class="sumh">비트로 세면? (수업)</div>
<div class="tw"><table><tr><th></th><th>계산</th><th>결과</th></tr>
<tr><td>원본</td><td>19글자 × 7비트</td><td><b>133비트</b></td></tr>
<tr><td>묶음 1개</td><td>글자 7비트 + 횟수 3비트 (5 = 101)</td><td>10비트</td></tr>
<tr><td>압축 후</td><td>묶음 5개 × 10비트</td><td><b>50비트</b></td></tr></table></div>
<div class="sumh">약점: 반복이 없으면 오히려 손해</div>
<p class="cap">ABCDEF (6글자)</p>${cells('ABCDEF')}
<p class="cap">압축하면 12글자</p>${cells('A1B1C1D1E1F1',ch=>/\d/.test(ch)?'c3':'')}
<p>숫자 1이 계속 붙어서 <b>2배로 늘어났어요.</b> 그래서 데이터 특성을 보고 압축 방법을 골라야 해요.</p>
<div class="sumh">교과서 실습 결과 (모두 20글자)</div>
<div class="tw"><table><tr><th>문자 데이터</th><th>압축률</th></tr>
<tr><td>RRRRRAAAAGGGRRRRRGGG → R5A4G3R5G3</td><td>2.0</td></tr>
<tr><td>RRRAAGGGGRRRAAAGGGRR → R3A2G4R3A3G3R2</td><td>약 1.4</td></tr>
<tr><td>AABBBCDDDEEEFFGGGHHH → A2B3C1D3E3F2G3H3</td><td>1.25</td></tr>
<tr><td>ABCDEFGHIJKLMNOPQRST → A1B1…T1</td><td>0.5</td></tr></table></div>
<p>같은 20글자인데 반복이 많을수록 압축률이 높죠? 이미지(같은 색 픽셀, 예: WWBBBWWW → W2B3W3)나 배경 변화가 적은 동영상에도 써요.</p>
<div class="sumh">파이썬 코드는 이렇게 생각해요 (교과서 52쪽)</div>
<div class="flow"><div class="node"><small>한 글자씩 앞 글자와 비교</small>같으면 <code>count</code> +1</div><div class="arr"></div><div class="node"><small>다르면</small>앞 글자 + <code>count</code>를 결과에 붙이고 <code>count</code>를 1로</div><div class="arr"></div><div class="node k"><small>마지막</small>남은 글자 + <code>count</code> 붙이기, 압축률 = <code>len(data) / len(encoded)</code></div></div>
${star('① 연속된 것만 묶기 ② 묶음 개수 정확히 세기 ③ 반복 없으면 늘어난다 ④ <b>비손실</b> 압축이다. 이 네 개가 계속 나와요.')}`},
{id:'1-7',t:'허프만 압축',h:`
<p>반복 길이 압축은 반복이 없으면 손해였죠? 그래서 나온 게 허프만 압축이에요. 아이디어는 이거예요.</p>
${one('<mark>자주 나오는 글자는 짧은 코드, 드물게 나오는 글자는 긴 코드</mark>')}
<div class="tip"><b>비유</b> 카톡에서 자주 쓰는 "응"은 "ㅇㅇ", "고고"는 "ㄱㄱ"로 짧게 쓰잖아요. 자주 쓰는 말일수록 짧게 줄이면 전체 타자 수가 확 줄어요.</div>
<div class="sumh">만드는 법: 딱 3가지만</div>
<ol class="sum"><li>글자마다 몇 번 나왔는지(<b>빈도수</b>) 센다.</li><li><b>가장 작은 두 개</b>를 합친다. 하나 남을 때까지 반복!</li><li>완성된 나무(<b>이진 트리</b>)를 위에서부터 따라 내려가며 가지 번호를 읽는다.</li></ol>
<div class="sumh">수업 예제: R10 G5 A4</div>
${hSteps([['R10','G5','A4'],['R10','[9]'],['[19]']])}
<p>2단계에서 가장 작은 G5와 A4를 합쳐 9, 3단계에서 R10과 9를 합쳐 19. 이걸 나무로 그리면 이래요. (수업 규칙: <b>오른쪽 0, 왼쪽 1</b>)</p>
${tree({v:'19',c:[{v:'9',c:['A4','G5'],e:['1','0']},'R10'],e:['1','0']},'R10 G5 A4 허프만 트리')}
<p>맨 위(<b>루트</b>)에서 출발해서 R까지 가 보세요. 오른쪽 한 번 → <b>0</b>. G는 왼쪽(1) 갔다가 오른쪽(0) → <b>10</b>. A는 왼쪽 두 번 → <b>11</b>.</p>
<div class="tw"><table><tr><th>글자</th><th>코드</th><th>비트</th></tr><tr><td>R (10번)</td><td>0</td><td>10 × 1 = 10</td></tr><tr><td>G (5번)</td><td>10</td><td>5 × 2 = 10</td></tr><tr><td>A (4번)</td><td>11</td><td>4 × 2 = 8</td></tr><tr><td colspan="2"><b>합계</b></td><td><b>28비트</b></td></tr></table></div>
<div class="vs"><div><small>그대로</small><b>133</b></div><span>›</span><div><small>반복 길이</small><b>50</b></div><span>›</span><div class="on"><small>허프만</small><b>28</b></div></div>
<p>가장 많이 나온 R이 가장 짧은 코드(1비트)를 받은 거, 보이죠? 이게 허프만의 전부예요.</p>
<div class="sumh">코드가 붙어 있어도 안 헷갈리는 이유</div>
<p>어떤 코드도 <b>다른 코드의 앞부분이 아니에요.</b> 0으로 시작하면 무조건 R. 1로 시작하면 다음 숫자를 봐서 G(10)인지 A(11)인지 정해져요.</p>
<p class="cap">010110을 읽으면?</p>${cells('0│10│11│0',ch=>ch==='│'?'sep':'c1')}<p>→ <b>R G A R</b>. 딱 한 가지로만 읽혀요.</p>
<div class="warn"><b>가지 번호 주의</b> 수업 필기는 "오른쪽 0, 왼쪽 1", 교과서는 "<b>왼쪽 0, 오른쪽 1</b>"이에요. 규칙을 바꾸면 0과 1만 뒤집히고 <b>전체 비트 수는 같아요.</b> 시험 기준은 선생님께 확인!</div>
<div class="sumh">교과서 예제: RABRBGRARRARG</div>
${hSteps([['R6','A3','B2','G2'],['R6','A3','[4]'],['R6','[7]'],['[13]']])}
${tree({v:'13',c:[{v:'7',c:[{v:'4',c:['B2','G2'],e:['0','1']},'A3'],e:['0','1']},'R6'],e:['0','1']},'RABRBGRARRARG 허프만 트리')}
<ul class="sum"><li>교과서 규칙(왼쪽 0, 오른쪽 1): R = 1, A = 01, G = 001, B = 000</li><li>원본 13글자 × 8비트 = <b>104비트</b> → 허프만 <b>24비트</b> (6 + 6 + 6 + 6)</li></ul>
<div class="sumh">작년 기출 그대로: ABBGGGABGGG</div>
<div class="past"><b>작년 기출 (3문제 세트)</b>허프만 압축(내림차순 정렬 기준)으로 ① 트리 고르기 ② 압축 결과 비트열 고르기 ③ 압축률 구하기가 연달아 나왔어요.</div>
${hSteps([['G6','B3','A2'],['G6','[5]'],['[11]']])}
<p>내림차순이니까 <b>큰 게 왼쪽</b>에 서요. G6이 왼쪽, 5(B3, A2)가 오른쪽. 교과서 규칙(왼쪽 0, 오른쪽 1)으로 그리면 이래요.</p>
${tree({v:'11',c:['G6',{v:'5',c:['B3','A2'],e:['0','1']}],e:['0','1']},'ABBGGGABGGG 허프만 트리')}
<div class="tw"><table><tr><th>글자</th><th>왼쪽 0 · 오른쪽 1</th><th>왼쪽 1 · 오른쪽 0</th></tr><tr><td>G (6번)</td><td>0</td><td>1</td></tr><tr><td>B (3번)</td><td>10</td><td>01</td></tr><tr><td>A (2번)</td><td>11</td><td>00</td></tr></table></div>
<p class="cap">A B B G G G A B G G G를 하나씩 바꾸면 (왼쪽 0 규칙)</p>${cells('1110100001110000',()=>'c1')}
<ul class="sum"><li>합계: 6×1 + 3×2 + 2×2 = <b>16비트</b></li><li>원본: 11글자 × 8비트 = 88비트</li></ul>
<p class="fl">압축률 = ${frac(88,16)} = <b>5.5</b></p>
<div class="warn"><b>진짜 함정</b> 작년 시험엔 "왼쪽 1 · 오른쪽 0" 트리(<code>0001011110001111</code>)와 "왼쪽 0 · 오른쪽 1" 트리(<code>1110100001110000</code>)가 <b>둘 다 선지에</b> 있었어요. 올해 수업 필기는 "오른쪽 0, 왼쪽 1"이에요. 규칙에 따라 정답이 갈리니까 시험 전에 선생님께 꼭 확인하세요! 압축률(5.5)은 규칙과 상관없이 같아요.</div>
<div class="sumh">도전: A5 B9 C12 D13 E16 F45</div>
${hSteps([['A5','B9','C12','D13','E16','F45'],['C12','D13','[14]','E16','F45'],['[14]','E16','[25]','F45'],['[25]','[30]','F45'],['F45','[55]'],['[100]']])}
<div class="warn"><b>여기서 많이 틀려요</b> 14를 만든 다음, 14+E16이 아니라 <b>C12+D13</b>을 먼저 합쳐요. 매번 "지금 남은 것 중 제일 작은 두 개"예요.</div>
${tree({v:'100',c:['F45',{v:'55',c:[{v:'25',c:['C12','D13'],e:['0','1']},{v:'30',c:['E16',{v:'14',c:['A5','B9'],e:['0','1']}],e:['0','1']}],e:['0','1']}],e:['0','1']},'A5부터 F45까지 허프만 트리')}
<ul class="sum"><li>F 1비트, C·D·E 3비트, A·B 4비트</li><li>45×1 + (12+13+16)×3 + (5+9)×4 = <b>224비트</b> (모두 3비트로 쓰면 300비트)</li></ul>
<div class="sumh">연습: PEPERODAY</div>
<p>빈도수 P2 E2 R1 O1 D1 A1 Y1. 8비트씩이면 72비트예요.</p>
${tree({v:'9',c:[{v:'4',c:['E2','P2'],e:['1','0']},{v:'5',c:[{v:'2',c:['O1','R1'],e:['1','0']},{v:'3',c:['Y1',{v:'2',c:['A1','D1'],e:['1','0']}],e:['1','0']}],e:['1','0']}],e:['1','0']},'PEPERODAY 허프만 트리')}
<ul class="sum"><li>P·E 2비트, R·O·Y 3비트, A·D 4비트 → 8 + 9 + 8 = <b>25비트</b></li><li>빈도수가 같은 게 많으면 나무 모양은 달라질 수 있지만 <b>전체 비트 수는 같아요.</b></li></ul>
${star('① 가장 작은 두 개부터 합치기 ② 전체 비트 = 빈도수 × 코드 길이의 합 ③ 빈도수 높을수록 짧은 코드 ④ 어떤 코드도 다른 코드의 앞부분이 아님')}`}
],
sum:['비트 = 최소 단위, 1Byte = 8bit, 위로는 1,024배씩','디지털화: 표본화 → 양자화 → 부호화','RAM은 전원 끄면 사라짐 → 보조 기억에 저장','압축 = 인코딩, 복원 = 디코딩','손실(JPEG·MP3·MPEG4) vs 비손실(ZIP·PNG·GIF)','압축 원리 = 중복성 제거 (공간적 / 시간적)','압축률 = 압축 전 ÷ 압축 후, 1보다 클수록 좋음','A = 65 = 1000001 (아스키 7비트), 깨짐 = 코드 체계 차이','반복 길이 압축: 연속된 것만 묶기, 반복 없으면 늘어남','허프만: 빈도 높을수록 짧은 코드, 작은 두 개씩 합치기']},
{id:2,date:'11/12',title:'암호화',pages:'교과서 p.56~61',
one:'암호화는 <b>허락받은 사람만 볼 수 있게 데이터를 바꾸는 기술</b>이고, 핵심은 <b>키(열쇠)를 어떻게 관리하느냐</b>예요.',
secs:[
{id:'2-1',t:'http와 https',h:`
<p>인터넷 주소창, 맨 앞을 한번 보세요. http로 시작하나요, https로 시작하나요? 이 <b>s 하나</b>가 엄청난 차이예요.</p>
${httpPic()}
<ul class="sum"><li><b>http://</b> 데이터를 <b>그대로</b> 보내요. 엽서처럼 중간에서 누구나 읽을 수 있어요. → <mark>비밀번호, 카드 번호 입력 금지!</mark></li><li><b>https://</b> 데이터를 <b>암호화해서</b> 보내요. 봉인된 편지처럼 받는 사람만 열 수 있어요.</li></ul>
<div class="tip"><b>덤</b> 실제 https는 뒤에 배울 공개키 암호와 비밀키 암호를 섞어서 써요. 시험에선 "https = 암호화해서 전송"이면 충분해요.</div>`},
{id:'2-2',t:'모든 암호는 깰 수 있다?',h:`
<p>충격적인 사실 하나. <b>모든 암호는 이론적으로 다 깰 수 있어요.</b> 왜냐면 가능한 경우를 하나씩 다 넣어 보면 언젠가는 맞거든요.</p>
${lockPic()}
<p>그럼 암호가 왜 안전하냐? <mark>푸는 데 시간이 엄청 오래 걸리게</mark> 만들기 때문이에요.</p>
<div class="tw"><table><tr><th>비밀번호</th><th>경우의 수</th></tr><tr><td>숫자 4자리</td><td>1만 가지</td></tr><tr><td>숫자 8자리</td><td>1억 가지</td></tr><tr><td>영어 대소문자 + 숫자 8자리</td><td>약 218조 가지</td></tr></table></div>
<p>길고 복잡할수록 경우의 수가 폭발해서, 컴퓨터로도 몇백 년 걸리게 만드는 거예요. <b>시간이 곧 안전</b>이에요.</p>
<div class="warn"><b>양자 컴퓨터</b> 경우의 수를 엄청나게 빨리 계산할 수 있어요. 그래서 양자 컴퓨터가 나오면 지금의 암호가 깨질 수 있다고 해요.</div>
<div class="sumh">교과서 도입: 에니그마</div>
<p>제2차 세계 대전 때 독일군 암호 <b>에니그마</b>는 24시간마다 규칙이 바뀌었어요. <b>앨런 튜링</b>이 <b>봄브</b>라는 기계를 만들어 결국 풀어냈죠. (영화 '이미테이션 게임')</p>`},
{id:'2-3',t:'암호 시스템의 구성 요소',h:`
<p>암호를 "편지를 상자에 넣고 자물쇠로 잠그는 것"이라고 생각하면 끝이에요.</p>
<div class="kit"><div><b>평문</b><span>편지 내용</span><small>암호화 안 된 원래 데이터</small></div><div><b>암호문</b><span>잠긴 상자</span><small>키와 알고리즘으로 바꾼 데이터</small></div><div class="k"><b>키</b><span>열쇠</span><small>암호화·복호화에 쓰는 약속된 규칙 정보</small></div><div><b>알고리즘</b><span>자물쇠 작동 방식</span><small>암호화(복호화) 절차, 키가 필요</small></div></div>
${star('"암호화와 복호화 과정에서 사용되는 약속된 규칙 정보" = <b>키</b>. 이 문장 그대로 나와요.')}
<div class="sumh">섀넌의 원칙 (교과서 보충)</div>
<ul class="sum"><li><b>혼돈</b>: 암호문과 <b>키</b>의 관계를 숨겨요.</li><li><b>확산</b>: 암호문과 <b>평문</b>의 관계를 숨겨요.</li></ul>
<div class="tip"><b>외우는 법</b> "혼돈은 키, 확산은 평문"</div>`},
{id:'2-4',t:'암호화와 복호화',h:`
${flow3(['평문','hello','bx'],['암호문','X89V#','bp'],['평문','hello','bx'],'암호화','복호화',{keys:1})}
<ul class="sum"><li><mark>암호화</mark>: 평문 → 암호문 (잠그기)</li><li><mark>복호화</mark>: 암호문 → 평문 (열기)</li></ul>
<div class="warn"><b>선생님이 제일 강조한 것</b> 중요한 건 <b>키</b>예요. 아무리 튼튼한 금고도 열쇠를 아무 데나 두면 끝이죠. 키를 어떻게 관리하느냐가 관건이고, 이게 뒤에 나오는 비밀키·공개키를 나누는 기준이에요.</div>`},
{id:'2-5',t:'암호화가 지켜 주는 것',h:`
<p>교과서는 암호화의 기능을 이렇게 정리해요. 이름만 봐도 뜻이 보이니까 겁먹지 마세요.</p>
<div class="tw"><table><tr><th>기능</th><th>한마디로</th></tr>
<tr><td><b>기밀성 보장</b></td><td>몰래 <b>보는</b> 걸 막음</td></tr>
<tr><td><b>무결성 유지</b></td><td>몰래 <b>바꾸는</b> 걸 막음</td></tr>
<tr><td><b>인증 및 식별 보장</b></td><td>진짜 그 사람인지 확인</td></tr>
<tr><td><b>비인가 접근 방지</b></td><td>허락 없는 접근 차단</td></tr>
<tr><td><b>보안 통신 보장</b></td><td>네트워크로 주고받을 때 보호</td></tr>
<tr><td><b>보안 공격으로부터 보호</b></td><td>뚫려도 내용은 못 알아봄</td></tr>
<tr><td><b>규정 준수</b></td><td>데이터 보호 규정 지키기</td></tr></table></div>
<div class="sumh">정보 보호 3원칙 CIA</div>
<div class="cia"><div><b>C</b><span>기밀성</span><small>허가된 사람만 <b>본다</b></small></div><div><b>I</b><span>무결성</span><small>허가된 사람만 <b>고친다</b></small></div><div><b>A</b><span>가용성</span><small>필요할 때 <b>언제든 쓴다</b></small></div></div>
${star('"데이터가 중간에 변경되는 것 방지" = <b>무결성</b>. "용량을 줄인다"는 암호화 기능이 아니라 압축이에요.')}
<div class="past"><b>작년 기출</b>&lt;보기&gt;에 "인증 및 식별 <b>차단</b>", "비인가자 접근 <b>허용</b>"처럼 말을 <b>반대로 바꾼</b> 함정이 나왔어요. 정답은 무결성 유지, 기밀성 보장, 보안 공격으로부터 보호 3개였어요. 끝말까지 꼼꼼히!</div>`},
{id:'2-6',t:'치환형 암호와 전치형 암호',h:`
<p>옛날 암호 두 가지예요. 차이는 딱 하나.</p>
<div class="vs2"><div><b>치환형</b><span>글자를 <mark>다른 글자로</mark> 바꿈</span><small>글자가 옷을 갈아입음<br>예: 카이사르 암호</small></div><div><b>전치형</b><span>글자의 <mark>자리를</mark> 바꿈</span><small>글자들이 자리를 바꿔 앉음<br>예: 스키테일 암호</small></div></div>
<div class="sumh">카이사르 암호 (치환형)</div>
<p>로마의 카이사르가 쓴 암호예요. 알파벳을 정해진 칸만큼 밀어요. 아래는 <b>오른쪽 3칸</b>이에요.</p>
<div class="cz"><div>${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<i>${c}</i>`).join('')}</div><div>${'defghijklmnopqrstuvwxyzabc'.split('').map(c=>`<i>${c}</i>`).join('')}</div></div>
<p class="cap">평문</p>${cells('informatics')}<p class="cap">암호문 (3칸씩 밀기)</p>${cells('lqirupdwlfv',()=>'c1')}
<ul class="sum"><li>"3칸 이동"이 바로 <b>키</b>예요.</li><li>끝에 가면 처음으로: x → a, y → b, z → c</li><li>복호화는 거꾸로 3칸: khoor → hello</li></ul>
<div class="sumh">전치형 암호: 키 453216</div>
<p><b>1단계</b> 키가 6자리니까 한 줄에 6글자씩 적어요. 빈칸은 <code>:</code>로 채워요.</p>
<div class="tw"><table class="tt"><tr><th>열</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><td>1줄</td><td>i</td><td>n</td><td>f</td><td>o</td><td>r</td><td>m</td></tr><tr><td>2줄</td><td>a</td><td>t</td><td>i</td><td>c</td><td>s</td><td>:</td></tr></table></div>
<p><b>2단계</b> 키 순서대로 4번 열, 5번 열, 3번, 2번, 1번, 6번 열을 차례로 세워요.</p>
<div class="tw"><table class="tt"><tr><th>키</th><th>4</th><th>5</th><th>3</th><th>2</th><th>1</th><th>6</th></tr><tr><td>1줄</td><td>o</td><td>r</td><td>f</td><td>n</td><td>i</td><td>m</td></tr><tr><td>2줄</td><td>c</td><td>s</td><td>i</td><td>t</td><td>a</td><td>:</td></tr></table></div>
<p class="cap">암호문</p>${cells('orfnimcsita:',()=>'c1')}
<p>글자는 하나도 안 바뀌고 <b>자리만</b> 바뀌었죠? 이게 치환형과의 차이예요.</p>
<div class="sumh">카이사르 암호 파이썬 코드 읽기 (작년 기출)</div>
<p>작년엔 카이사르 암호 프로그램을 주고 <b>실행 결과</b>를 고르게 했어요. 코드는 길어 보여도 하는 일은 딱 하나예요.</p>
<pre class="code">alphabet = 'abcdefghijklmnopqrstuvwxyz'
for char in plaintext:
    if char not in alphabet:      # 알파벳이 아니면
        ciphertext += char        #   그대로 붙임
    else:
        idx = alphabet.index(char)          # ① 몇 번째 글자?
        idx = (idx + shift) % len(alphabet) # ② shift만큼 밀고 26으로 나눈 나머지
        ciphertext += alphabet[idx]         # ③ 그 자리 글자 붙이기</pre>
<div class="flow"><div class="node"><small>① index</small>a는 0번, b는 1번 … z는 25번</div><div class="arr"></div><div class="node"><small>② (idx + shift) % 26</small>shift가 <b>양수면 오른쪽</b>, <b>음수면 왼쪽</b>으로 밀어요. <code>% 26</code>은 끝을 넘어가면 처음으로 돌려 주는 장치예요.</div><div class="arr"></div><div class="node k"><small>③ alphabet[idx]</small>새 번호의 글자를 붙여요.</div></div>
<div class="card"><b>예) fighting, shift = -5 (왼쪽 5칸)</b><br>f(5) → 0 → a, i(8) → 3 → d, g(6) → 1 → b, h(7) → 2 → c, t(19) → 14 → o, i → d, n(13) → 8 → i, g → b<br>결과: <b>adbcodib</b></div>
<div class="warn"><b>오답 선지 패턴</b> ightingf, ingfight처럼 <b>글자 순서만 돌린</b> 선지가 나와요. 카이사르는 글자를 <b>바꾸는</b> 치환형이지 자리를 옮기는 게 아니에요!</div>
<div class="sumh">전치형 암호 다시 한 번: 키 2413, computer</div>
<p>키가 4자리 → 4글자씩 끊기. 그다음 <b>키에 적힌 숫자 순서대로 열을 뽑아요.</b></p>
<div class="tw"><table class="tt"><tr><th>열</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>1줄</td><td>c</td><td>o</td><td>m</td><td>p</td></tr><tr><td>2줄</td><td>u</td><td>t</td><td>e</td><td>r</td></tr></table></div>
<p>키 2413 → 2번, 4번, 1번, 3번 열 순서: <b>o p c m</b> / <b>t r u e</b> → <b>opcmtrue</b></p>
<div class="past"><b>작년 기출</b>평문 network, 키 3241 → netw / ork: → 3·2·4·1번 열 → tewn / kr:o → <b>tewnkr:o</b>. 빈칸 채운 <code>:</code>도 그대로 들어가요. "n3e2t4w1…"처럼 숫자를 끼워 넣은 선지는 함정!</div>
<div class="sumh">스키테일 암호 (전치형)</div>
<p>기원전 450년경 고대 그리스에서 쓴, 가장 오래된 암호예요. 막대에 종이를 감고 글을 쓴 뒤 풀면 글자가 뒤죽박죽이 돼요. <b>같은 굵기의 막대</b>에 다시 감아야 읽을 수 있어요. 막대 굵기가 키인 셈이에요.</p>
${star('카이사르 = <b>치환형</b>, 스키테일 = <b>전치형</b>. 카이사르는 직접 암호문 만들기 / 평문 찾기 / 몇 칸인지 찾기 계산 문제가 나와요.')}`},
{id:'2-7',t:'비밀키 암호 (대칭키)',h:`
${one('암호화와 복호화에 <mark>같은 키 하나</mark>를 써요. 그래서 <b>대칭키</b>.')}
${ab('비밀키 암호','비밀키로 잠금','같은 비밀키로 열기',['키 1개를 둘이 똑같이 공유','','bp'])}
<div class="tip"><b>비유</b> 집 현관 열쇠를 복사해서 가족끼리 나눠 갖는 거예요. 편하고 빠르죠. 그런데 한 명이 잃어버리면? <b>우리 집 문이 뚫려요.</b> 그리고 처음에 열쇠를 상대에게 안전하게 건네주는 것부터가 문제예요.</div>
<div class="pc"><div><b>장점</b>빠르다, 만들기 쉽다</div><div><b>단점</b>키를 전달·관리하기 어렵다</div></div>
<p>대표 예시: <b>DES, AES</b> (이름만 알면 돼요. DES는 옛날 표준, AES는 그 후속으로 지금 많이 써요.)</p>`},
{id:'2-8',t:'공개키 암호 (비대칭키)',h:`
${one('<mark>서로 다른 키 두 개</mark>를 써요. 누구나 가져가는 <b>공개키</b> + 나만 가진 <b>개인키</b>. 그래서 <b>비대칭키</b>.')}
<div class="tip"><b>비유</b> 우체통이에요. 편지 넣는 구멍(<b>공개키</b>)은 누구나 쓸 수 있지만, 꺼내는 열쇠(<b>개인키</b>)는 우체부만 있어요. 열쇠를 건네줄 필요가 없으니 비밀키의 단점이 해결돼요.</div>
${ab('공개키 암호','B의 공개키로 잠금','B의 개인키로 열기',['B의 공개키','누구나 가짐 · 잠금용','bw'],['B의 개인키','B만 가짐 · 열기용','br'])}
<div class="flow"><div class="node"><small>1</small>받는 사람 B가 공개키·개인키 한 쌍을 만든다</div><div class="arr"></div><div class="node"><small>2</small>B가 공개키를 공개한다</div><div class="arr"></div><div class="node"><small>3</small>보내는 사람 A가 B의 공개키를 받아온다</div><div class="arr"></div><div class="node"><small>4</small>A가 <b>B의 공개키</b>로 잠근다</div><div class="arr"></div><div class="node"><small>5</small>암호문을 B에게 보낸다</div><div class="arr"></div><div class="node k"><small>6</small>B가 <b>자기 개인키</b>로 연다</div></div>
${star('A가 B에게 보낼 때 → 잠그는 키 <b>B의 공개키</b>, 여는 키 <b>B의 개인키</b>. "받는 사람 키 두 개"만 기억하면 끝!')}
<p>대표 예시: <b>RSA, ECC</b></p>
<div class="sumh">한눈에 비교</div>
<div class="tw"><table><tr><th></th><th>비밀키 (대칭)</th><th>공개키 (비대칭)</th></tr>
<tr><td>키 개수</td><td>1개 (같은 키)</td><td>2개 (다른 키)</td></tr>
<tr><td>키 전달</td><td>필요</td><td>불필요</td></tr>
<tr><td>속도</td><td><b>빠름</b></td><td>느림</td></tr>
<tr><td>장점</td><td>구현 쉬움</td><td>해독 어려움</td></tr>
<tr><td>단점</td><td>키 관리 어려움</td><td>시간 오래 걸림</td></tr>
<tr><td>예시</td><td>DES, AES</td><td>RSA, ECC</td></tr></table></div>`},
{id:'2-9',t:'해시',h:`

Q('a21','1-5','계산','\'A\'가 10진수 65일 때, \'D\'를 2진수로 나타낸 것은?',['1000010','1000011','1000100','1000101','1001000'],3,
'A=65, B=66, C=67, D=68이에요. 68 = 64 + 4라서 1000100이에요. ①은 66(B), ②는 67(C), ④는 69(E)예요.');
Q('a22','1-5','개념','수업에서 다룬 아스키코드는 문자 하나를 몇 비트로 표현하는가?',['4비트','6비트','7비트','16비트','32비트'],3,
'아스키코드는 7비트예요. 그래서 반복 길이 압축 계산에서 문자 하나를 7비트로 셌어요.');
Q('a23','1-5','개념','유니코드에 대한 설명으로 옳은 것은?',['영어 대문자만 표현할 수 있다.','전 세계 문자를 하나의 체계로 표현하기 위한 국제 표준이다.','이미지 손실 압축 방식이다.','문자의 빈도수로 코드를 만드는 압축 알고리즘이다.','아스키코드보다 적은 비트로 모든 문자를 표현한다.'],2,
'유니코드(UTF-8, UTF-16)는 나라마다 다른 코드 때문에 글자가 깨지는 문제를 해결하려고 만든 국제 표준이에요. ④는 허프만 압축 설명이에요.');
Q('a24','1-5','적용','다른 나라에서 만든 텍스트 파일을 열었더니 글자가 깨져 보였다. 가장 큰 원인은?',['파일이 손실 압축되었기 때문','서로 다른 문자 코드 체계를 사용했기 때문','RAM의 전원이 꺼졌기 때문','해시값으로 변환되었기 때문','암호화 키를 잃어버렸기 때문'],2,
'문자는 코드표 번호로 저장돼요. 만든 쪽과 여는 쪽의 코드 체계가 다르면 번호를 다른 글자로 읽어서 깨져 보여요.');
Q('a25','1-6','계산','문자열 AAABBBBCCD를 반복 길이 압축으로 나타낸 것은? (교과서 방식)',['A3B4C2D','A3B4C2D1','3A4B2C1D','A3B4C2D2','AB3C2D1'],2,
'문자 다음에 반복 횟수를 써요. D는 한 번만 나와도 D1로 써요. ③처럼 숫자를 앞에 쓰면 교과서 방식이 아니에요.');
Q('a26','1-6','계산','RRRRRAAAAGGGRRRRRGG를 반복 길이 압축한 결과와 압축률을 바르게 짝지은 것은?',['R10A4G5, 1.9','R5A4G3R5G2, 1.9','R5A4G3R5G2, 0.5','R5A4G5, 2.0','R5A4G3R5G2, 1.0'],2,
'연속된 것만 묶어야 해요. R5 A4 G3 R5 G2로 10글자이고, 압축률은 19 ÷ 10 = 1.9예요. ①은 연속이 아닌 R까지 합친 것이라 틀려요.');
Q('a27','1-6','계산','WWWWWWWWBBBB를 반복 길이 압축했을 때 압축률은?',['1.5','2','3','4','6'],3,
'W8B4로 4글자가 돼요. 12 ÷ 4 = 3이에요.');
Q('a28','1-6','계산','반복 길이 압축 결과가 X3Y1Z4일 때 원래 문자열은?',['XYZ','XXXYZZZZ','XXXYZZZ','XYYYZZZZ','XXXYYZZZZ'],2,
'X 3번, Y 1번, Z 4번이에요. 복원(디코딩)은 숫자만큼 문자를 다시 늘어놓으면 돼요.');
Q('a29','1-6','적용','반복 길이 압축을 했을 때 압축 효과가 가장 낮은 것은?',['AAAAAAAAAA','AAAAABBBBB','AABBAABBAA','ABCDEFGHIJ','AAAAAAAAAB'],4,
'①은 A10(3글자), ②는 A5B5(4글자), ③은 A2B2A2B2A2(10글자), ⑤는 A9B1(4글자)인데, ④는 A1B1…J1로 20글자가 돼서 오히려 2배로 늘어나요(압축률 0.5).');
Q('a30','1-6','보기','반복 길이 압축에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',BK5,3,
'ㄷ이 함정이에요. 반복 길이 압축은 복원하면 원본과 똑같이 돌아오는 비손실 압축이에요.',
'ㄱ. 같은 문자가 연속해서 반복될 때 효과적이다.<br>ㄴ. 중복이 없으면 원본보다 길어질 수 있다.<br>ㄷ. 복원하면 원본과 달라지는 손실 압축이다.');
Q('a31','1-6','계산','문자 하나는 7비트, 반복 횟수는 3비트로 나타낸다고 할 때, RRRRRAAAAGGGRRRRRGG의 원본 비트 수와 반복 길이 압축 후 비트 수를 순서대로 고른 것은?',['133비트, 40비트','133비트, 50비트','152비트, 50비트','133비트, 70비트','152비트, 80비트'],2,
'원본: 19 × 7 = 133비트. 압축 후: 묶음 하나가 7 + 3 = 10비트이고, R5 A4 G3 R5 G2로 묶음 5개라서 50비트예요. 묶음을 4개로 세면 ①이 나와요.');
Q('a32','1-6','적용','흰색(W)과 검은색(B) 픽셀로 된 이미지의 한 줄 WWBBBBWW를 반복 길이 압축으로 나타낸 것은?',['W2B4W2','W2B4','W4B4','2W4B2W','WB4W'],1,
'이미지에서도 같은 색이 연속되면 색 + 횟수로 써요. 앞의 W2와 뒤의 W2는 떨어져 있으니 따로 써야 해요.');
Q('a33','1-6','적용','반복 길이 압축을 활용하기에 적절하지 않은 것은?',['같은 색이 넓게 이어지는 이미지','배경 변화가 적은 동영상','같은 문자가 연속되는 문자열','모든 문자가 서로 다른 짧은 문장','흰색과 검은색만으로 된 단순한 아이콘'],4,
'모든 문자가 서로 달라 연속 반복이 없으면 오히려 길어져요.');
Q('a34','1-6','적용','교과서 52쪽 반복 길이 압축 프로그램에서 압축률을 구하는 식으로 옳은 것은? (data는 원본, encoded는 압축 결과)',['len(encoded) / len(data)','len(data) / len(encoded)','len(data) - len(encoded)','len(data) * len(encoded)','count / len(data)'],2,
'압축률 = 압축 전 ÷ 압축 후이니까 원본 길이를 압축 결과 길이로 나눠요.');
Q('a35','1-7','개념','허프만 압축의 원리로 옳은 것은?',['모든 문자에 같은 길이의 코드를 부여한다.','빈도수가 높은 문자에 짧은 코드, 낮은 문자에 긴 코드를 부여한다.','연속해서 반복되는 문자를 문자와 횟수로 나타낸다.','문자의 위치를 바꾸어 표현한다.','알파벳을 일정한 칸만큼 이동시킨다.'],2,
'③은 반복 길이 압축, ④는 전치형 암호, ⑤는 카이사르 암호의 설명이에요. 단원끼리 섞어서 내기 좋은 문제예요.');
Q('a36','1-7','적용','다음 빈도수로 허프만 트리를 만들 때 가장 먼저 합치는 두 문자는?',['A, B','E, F','C, D','A, F','B, C'],1,
'가장 작은 두 개부터 합쳐요. A5 + B9 = 14가 첫 번째예요.','A: 5, B: 9, C: 12, D: 13, E: 16, F: 45');
Q('a37','1-7','계산','다음 빈도수로 허프만 트리를 만들 때 두 번째로 만들어지는 노드의 값은?',['14','21','25','30','55'],3,
'첫 번째로 A5 + B9 = 14가 생기면 남은 값은 C12, D13, 14, E16, F45예요. 이 중 가장 작은 두 개는 C12와 D13이라서 25가 돼요. 14와 E16을 먼저 합치면 안 돼요.','A: 5, B: 9, C: 12, D: 13, E: 16, F: 45');
Q('a38','1-7','적용','다음 빈도수로 허프만 압축을 할 때 가장 짧은 코드를 받는 문자는?',['A','B','C','E','F'],5,
'빈도수가 가장 높은 F(45)가 1비트 코드를 받아요. 가장 긴 코드는 빈도수가 가장 낮은 A와 B예요.','A: 5, B: 9, C: 12, D: 13, E: 16, F: 45');
Q('a39','1-7','계산','다음 빈도수로 허프만 압축을 했을 때 전체 비트 수는?',['100비트','200비트','224비트','256비트','300비트'],3,
'F는 1비트, C·D·E는 3비트, A·B는 4비트예요. 45×1 + (12+13+16)×3 + (5+9)×4 = 45 + 123 + 56 = 224비트. 모든 문자를 3비트로 쓰면 300비트이니 76비트 줄어요.','A: 5, B: 9, C: 12, D: 13, E: 16, F: 45');
Q('a40','1-7','계산','R이 10번, G가 5번, A가 4번 나오는 19글자를 허프만 압축했을 때 전체 비트 수는?',['19비트','28비트','38비트','50비트','133비트'],2,
'G5 + A4 = 9, R10 + 9 = 19. R은 1비트, G와 A는 2비트예요. 10×1 + 5×2 + 4×2 = 28비트. ④는 반복 길이 압축, ⑤는 아스키 원본이에요.');
Q('a41','1-7','계산','허프만 코드가 R = 1, A = 01, G = 001, B = 000일 때, 1010001을 해독한 것은?',['RABR','RAGR','RRAB','ARBR','RABG'],1,
'앞에서부터 끊어 읽어요. 1(R) / 01(A) / 000(B) / 1(R) → RABR. 어떤 코드도 다른 코드의 앞부분이 아니라서 한 가지로만 읽혀요.');
Q('a42','1-7','계산','문자 하나를 8비트로 저장할 때, RABRBGRARRARG의 원본 비트 수와 허프만 압축 후 비트 수를 바르게 짝지은 것은?',['104비트, 24비트','104비트, 26비트','91비트, 24비트','13비트, 24비트','104비트, 13비트'],1,
'원본은 13 × 8 = 104비트. 빈도수 R6 A3 B2 G2에서 R 1비트, A 2비트, B·G 3비트라서 6 + 6 + 6 + 6 = 24비트예요. ③은 7비트로 계산한 값이에요.');
Q('a43','1-7','적용','허프만 코드로 사용할 수 없는 코드 묶음은?',['{0, 10, 11}','{1, 01, 001, 000}','{0, 01, 11}','{00, 01, 10, 11}','{1, 00, 01}'],3,
'0이 01의 앞부분이라서 01을 받았을 때 "0 다음 1"인지 "01"인지 헷갈려요. 허프만 코드는 어떤 코드도 다른 코드의 앞부분이 되면 안 돼요.');
Q('a44','1-7','보기','허프만 압축에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',BK5,5,
'셋 다 맞아요. 빈도수가 작은 두 개를 합치는 걸 반복해 이진 트리를 만들고, 가지에 0과 1을 붙여 코드를 읽어요.',
'ㄱ. 빈도수가 낮은 문자일수록 긴 코드를 받는다.<br>ㄴ. 빈도수가 작은 두 개를 합치는 과정을 반복해 트리를 만든다.<br>ㄷ. 트리의 가지에 0과 1을 부여해 코드를 정한다.');
Q('a45','1-7','계산','PEPERODAY를 문자당 8비트로 저장할 때의 비트 수와, 허프만 압축 후 비트 수를 바르게 짝지은 것은?',['72비트, 25비트','72비트, 27비트','63비트, 25비트','72비트, 9비트','81비트, 25비트'],1,
'원본 9 × 8 = 72비트. P·E(각 2번)는 2비트, R·O·Y(각 1번)는 3비트, A·D(각 1번)는 4비트예요. (2×2)+(2×2) + 3×3 + 4×2 = 8 + 9 + 8 = 25비트.');
Q('a46','1-7','개념','허프만 트리의 가지 번호 규칙을 "왼쪽 0, 오른쪽 1"에서 "왼쪽 1, 오른쪽 0"으로 바꾸면 어떻게 되는가?',['전체 비트 수가 달라진다.','각 문자 코드의 0과 1이 뒤바뀌지만 전체 비트 수는 같다.','각 문자의 코드 길이가 달라진다.','코드를 해독할 수 없게 된다.','문자의 빈도수가 바뀐다.'],2,
'트리 모양은 그대로이고 번호만 뒤집혀요. 코드 길이도 그대로라 전체 비트 수는 같아요. 수업 필기와 교과서 규칙이 반대니까 꼭 알아 두세요.');

/* ---------- 2회차: 암호화 ---------- */
Q('b01','2-1','개념','데이터를 암호화하여 전송하는 웹 사이트 주소의 시작 부분은?',['http://','https://','www.','.kr','.html'],2,
'https의 s는 secure(안전한)예요. http는 데이터를 그대로 보내요.');
Q('b02','2-1','적용','주소가 http://로 시작하는 사이트에서 가장 하지 말아야 할 행동은?',['뉴스 기사 읽기','날씨 확인하기','비밀번호와 카드 번호 입력하기','공지 사항 확인하기','사진 구경하기'],3,
'http는 엽서처럼 내용이 그대로 노출돼요. 중요한 정보를 입력하면 중간에서 가로챌 수 있어요.');
Q('b03','2-2','개념','현대 암호가 안전하다고 할 수 있는 가장 큰 이유는?',['절대 풀 수 없는 원리를 쓰기 때문','해독하는 데 매우 오랜 시간이 걸리도록 설계되었기 때문','암호문을 아무에게도 보내지 않기 때문','키를 사용하지 않기 때문','평문을 짧게 만들기 때문'],2,
'모든 경우의 수를 대입하면 이론적으로는 다 풀려요. 그래서 현대 암호는 푸는 데 엄청나게 오래 걸리게 만드는 게 핵심이에요.');
Q('b04','2-2','보기','암호의 안전성에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',BK5,5,
'셋 다 수업 내용 그대로예요. 양자 컴퓨터는 경우의 수를 엄청 빠르게 계산할 수 있어 현대 암호를 위협해요.',
'ㄱ. 가능한 경우의 수를 모두 대입하면 이론적으로 풀 수 있다.<br>ㄴ. 현대 암호는 오랜 시간 동안 풀지 못하도록 설계한다.<br>ㄷ. 양자 컴퓨터는 현대 암호에 위협이 될 수 있다.');
Q('b05','2-2','개념','제2차 세계 대전 당시 독일의 암호 체계 에니그마를 해독하기 위해 봄브라는 기계를 개발한 인물은?',['찰스 배비지','앨런 튜링','클로드 섀넌','율리우스 카이사르','폰 노이만'],2,
'컴퓨터 과학의 아버지 앨런 튜링이에요. 섀넌은 혼돈·확산 원칙을, 카이사르는 카이사르 암호를 만들었어요.');
Q('b06','2-3','개념','암호화되지 않은 상태의 데이터를 무엇이라 하는가?',['평문','암호문','키','해시값','알고리즘'],1,'평문은 누구나 읽을 수 있는 원래 데이터예요.');
Q('b07','2-3','개념','다음 설명에 해당하는 암호 시스템의 구성 요소는?',['평문','암호문','키','프레임','비트'],3,
'키는 열쇠 역할을 하는 약속된 규칙 정보예요. 카이사르 암호의 "3칸 이동"도 키예요.','암호화와 복호화 과정에서 사용되는 약속된 규칙 정보');
Q('b08','2-3','개념','암호 시스템의 구성 요소가 아닌 것은?',['평문','암호문','키','암호화(복호화) 알고리즘','압축률'],5,'구성 요소는 평문, 암호문, 키, 암호화(복호화) 알고리즘 네 가지예요. 압축률은 1회차 압축 단원 용어예요.');
Q('b09','2-3','개념','섀넌이 제시한 암호 설계 원칙 중 다음 설명에 해당하는 것은?',['확산','혼돈','치환','전치','해시'],2,
'혼돈은 암호문과 키의 관계를 숨겨요. 확산은 암호문과 평문의 관계를 숨겨요. "혼돈은 키"로 외우세요.','암호문과 키의 상관관계를 숨겨 암호문에서 키를 알아내기 어렵게 한다.');
Q('b10','2-3','개념','섀넌이 제시한 암호 설계 원칙 중 다음 설명에 해당하는 것은?',['혼돈','확산','기밀성','가용성','인증'],2,
'평문과의 관계를 숨기는 건 확산이에요.','암호문과 평문의 상관관계를 숨겨 암호문에서 평문을 알아내기 어렵게 한다.');
Q('b11','2-4','개념','복호화에 대한 설명으로 옳은 것은?',['평문을 암호문으로 바꾸는 과정','암호문을 평문으로 바꾸는 과정','원본 데이터를 압축하는 과정','평문을 해시값으로 바꾸는 과정','키를 평문으로 바꾸는 과정'],2,'암호화는 평문 → 암호문, 복호화는 암호문 → 평문이에요.');
Q('b12','2-4','개념','수업에서 암호 시스템의 보안을 지키는 데 가장 중요하다고 강조한 것은?',['암호문의 길이','키의 관리','평문의 글자 수','알고리즘의 이름','전송 속도'],2,
'키를 잃어버리거나 알려주면 다 깨져요. 키를 어떻게 관리하느냐가 관건이에요.');
Q('b13','2-5','개념','암호화가 제공하는 기능 중 "데이터가 중간에서 변경되는 것을 방지"하는 것은?',['기밀성 보장','무결성 유지','가용성 보장','규정 준수 요구 사항 충족','인증 및 식별 보장'],2,
'몰래 바꾸는 걸 막는 건 무결성이에요. 몰래 보는 걸 막는 건 기밀성이에요.');
Q('b14','2-5','개념','정보 보호의 3원칙(CIA)과 그 설명을 바르게 짝지은 것은?',['기밀성 - 허가된 사용자만 정보에 접근할 수 있다.','무결성 - 허가된 사용자가 필요할 때 언제든 접근할 수 있다.','가용성 - 허가된 사용자만 정보를 수정할 수 있다.','기밀성 - 정보가 변경되지 않도록 보장한다.','가용성 - 비인가자의 접근을 차단한다.'],1,
'기밀성은 접근, 무결성은 수정·삭제, 가용성은 필요할 때 사용이에요. ②와 ③은 설명이 서로 바뀌었어요.');
Q('b15','2-5','개념','정보 보호의 3원칙 중 "허가된 사용자가 필요할 때 언제든 정보에 접근할 수 있어야 한다"는 것은?',['기밀성','무결성','가용성','확산','혼돈'],3,'"사용 가능함"이라서 가용성이에요.');
Q('b16','2-5','개념','암호화가 제공하는 기능으로 옳지 않은 것은?',['기밀성 보장','무결성 유지','인증 및 식별 보장','비인가 접근 방지','데이터 용량 감소'],5,'용량을 줄이는 건 압축의 기능이에요. 암호화는 보안 기능을 제공해요.');
Q('b17','2-6','개념','치환형 암호 기법에 대한 설명으로 옳은 것은?',['평문 문자의 위치를 이동시킨다.','평문의 각 문자를 다른 문자로 바꾼다.','데이터를 고정된 길이로 바꾼다.','공개키와 개인키를 사용한다.','연속 반복되는 문자를 횟수로 나타낸다.'],2,
'치환형은 글자 자체를 바꾸고, 전치형은 위치를 바꿔요. ③은 해시, ④는 공개키, ⑤는 반복 길이 압축이에요.');
Q('b18','2-6','개념','카이사르 암호와 스키테일 암호를 바르게 분류한 것은?',['카이사르 - 치환형, 스키테일 - 전치형','카이사르 - 전치형, 스키테일 - 치환형','둘 다 치환형','둘 다 전치형','카이사르 - 해시, 스키테일 - 공개키'],1,
'카이사르는 알파벳을 다른 알파벳으로 바꾸는 치환형, 스키테일은 막대에 감아 글자 위치를 뒤섞는 전치형이에요.');
Q('b19','2-6','계산','평문 informatics를 오른쪽으로 3칸 이동하는 카이사르 암호로 암호화한 것은?',['lqirupdwlfv','lqirupdwlfu','hqirupdwlfv','informatics','orfnimcsita:'],1,
'i→l, n→q, f→i, o→r, r→u, m→p, a→d, t→w, i→l, c→f, s→v. ⑤는 전치형 암호 결과예요.');
Q('b20','2-6','계산','평문 cat을 오른쪽으로 3칸 이동하는 카이사르 암호로 암호화한 것은?',['dbu','fdw','ecv','fdx','zxq'],2,'c→f, a→d, t→w. ①은 1칸, ③은 2칸, ⑤는 왼쪽으로 3칸 이동한 결과예요.');
Q('b21','2-6','계산','오른쪽으로 3칸 이동하는 카이사르 암호로 만든 암호문이 khoor이다. 평문은?',['hello','world','khoor','nkrru','gdkkn'],1,'복호화는 반대로 왼쪽으로 3칸 옮겨요. k→h, h→e, o→l, o→l, r→o.');
Q('b22','2-6','계산','평문 xyz를 오른쪽으로 3칸 이동하는 카이사르 암호로 암호화한 것은?',['abc','xyz','uvw','yza','bcd'],1,'z 다음은 다시 a로 돌아가요. x→a, y→b, z→c.');
Q('b23','2-6','계산','카이사르 암호로 평문 dog가 암호문 grj가 되었다. 오른쪽으로 몇 칸 이동했는가?',['1칸','2칸','3칸','4칸','5칸'],3,'d→g, o→r, g→j 모두 3칸이에요. 이 "3"이 키예요.');
Q('b24','2-6','계산','평문 programming을 오른쪽으로 5칸 이동하는 카이사르 암호로 암호화한 것은?',['uwtlwfrrnsl','tvskveqqmrk','vxumxgssotm','uwtlwfrrnsm','orprgaimmgn:'],1,'p→u, r→w, o→t, g→l, a→f, m→r, i→n, n→s. ②는 4칸, ③은 6칸이에요.');
Q('b25','2-6','계산','다음 방법으로 평문 informatics를 전치형 암호로 암호화한 결과는?',['orfnimcsita:','lqirupdwlfv','informatics:','mrofni:scita','nifromtaics'],1,
'inform / atics: 두 줄을 4, 5, 3, 2, 1, 6번 열 순서로 읽으면 orfnim / csita: → orfnimcsita:',
'키는 453216이다. 평문을 한 줄에 6글자씩 적고 빈칸은 \':\'로 채운 뒤, 키 순서대로 열을 다시 배치한다.');
Q('b26','2-6','계산','다음 방법으로 평문 abcdef를 전치형 암호로 암호화한 결과는?',['cabfde','abcdef','bcaefd','cbafed','acbdfe'],1,
'abc / def 두 줄을 3, 1, 2번 열 순서로 읽으면 cab / fde → cabfde예요.','키는 312이다. 평문을 한 줄에 3글자씩 적은 뒤, 키 순서(3번 열, 1번 열, 2번 열)대로 열을 다시 배치한다.');
Q('b27','2-6','개념','전치형 암호의 특징으로 옳은 것은?',['글자가 다른 글자로 바뀐다.','사용된 글자의 종류와 개수는 그대로이고 위치만 바뀐다.','암호문을 평문으로 되돌릴 수 없다.','반드시 공개키가 필요하다.','키를 사용하지 않는다.'],2,'전치형은 자리만 바꿔서 글자 구성은 그대로예요. 키(열 순서, 막대 굵기)는 필요해요.');
Q('b28','2-6','개념','스키테일 암호에 대한 설명으로 옳은 것은?',['고대 로마의 카이사르가 만든 치환형 암호이다.','막대에 감아 쓴 글을 같은 굵기의 막대로만 읽을 수 있는 전치형 암호이다.','알파벳을 3칸씩 이동하는 암호이다.','현대에 널리 쓰이는 공개키 암호이다.','1993년 미국 국가안보국이 설계했다.'],2,
'스키테일은 기원전 450년경 고대 그리스의 전치형 암호예요. 막대 굵기가 키 역할을 해요. ⑤는 SHA 해시 설명이에요.');
Q('b29','2-7','개념','비밀키 암호 기법에 대한 설명으로 옳은 것은?',['서로 다른 두 개의 키를 사용한다.','암호화와 복호화에 같은 키를 사용하며 대칭키 암호라고도 한다.','암호문을 평문으로 복호화할 수 없다.','RSA가 대표적이다.','키를 누구에게나 공개해도 안전하다.'],2,'①, ⑤는 공개키 암호, ③은 해시, ④의 RSA는 공개키 암호예요.');
Q('b30','2-7','개념','비밀키 암호 기법의 단점으로 가장 적절한 것은?',['암호화 속도가 매우 느리다.','키를 안전하게 공유하고 관리하기 어렵다.','키가 두 개라서 복잡하다.','복호화가 불가능하다.','구현이 매우 어렵다.'],2,
'같은 키를 상대에게 건네줘야 해서, 전달 중에 새거나 한 사람이 잃어버리면 뚫려요. 비밀키는 오히려 빠르고 구현이 쉬워요.');
Q('b31','2-7','개념','비밀키 암호 기법의 대표적인 예로만 짝지은 것은?',['RSA, ECC','DES, AES','MD5, SHA','DES, RSA','AES, ECC'],2,'비밀키는 DES·AES, 공개키는 RSA·ECC, 해시는 MD5·SHA예요. 세 짝을 묶어서 외우세요.');
Q('b32','2-8','적용','공개키 암호 기법으로 A가 B에게 메시지를 보낼 때, A가 암호화에 사용하는 키는?',['A의 공개키','A의 개인키','B의 공개키','B의 개인키','A와 B가 공유한 비밀키'],3,
'받는 사람(B)이 열 수 있어야 하니까 B의 공개키로 잠가요. 그러면 B의 개인키를 가진 B만 열 수 있어요.');
Q('b33','2-8','적용','공개키 암호 기법으로 A가 보낸 암호문을 B가 복호화할 때 사용하는 키는?',['A의 공개키','A의 개인키','B의 공개키','B의 개인키','비밀키'],4,'B의 공개키로 잠근 건 B의 개인키로만 열 수 있어요.');
Q('b34','2-8','순서','공개키 암호 기법의 과정을 순서대로 바르게 나열한 것은?',['(나) → (라) → (가) → (마) → (다)','(라) → (나) → (가) → (마) → (다)','(나) → (가) → (라) → (마) → (다)','(가) → (나) → (라) → (마) → (다)','(나) → (라) → (마) → (가) → (다)'],1,
'키 쌍을 만들고(나) → 공개키를 공개하고(라) → A가 그 공개키로 암호화하고(가) → 보내고(마) → B가 개인키로 연다(다).',
'(가) A가 B의 공개키로 평문을 암호화한다.<br>(나) B가 공개키와 개인키 쌍을 생성한다.<br>(다) B가 자신의 개인키로 복호화한다.<br>(라) B가 공개키를 공개한다.<br>(마) A가 암호문을 B에게 전송한다.');
Q('b35','2-8','개념','공개키 암호 기법의 대표적인 예로만 짝지은 것은?',['DES, AES','RSA, ECC','MD5, SHA','AES, RSA','ZIP, PNG'],2,'RSA는 큰 수의 소인수분해, ECC는 타원 곡선을 이용해요.');
Q('b36','2-8','개념','비밀키 암호와 공개키 암호를 비교한 내용으로 옳은 것은?',['비밀키 암호는 공개키 암호보다 속도가 느리다.','공개키 암호는 서로 다른 두 개의 키를 사용한다.','비밀키 암호는 키를 전달할 필요가 없다.','공개키 암호는 암호화 키와 복호화 키가 같다.','공개키 암호의 대표적인 예는 DES이다.'],2,'비밀키는 빠르지만 키 전달이 필요하고, 공개키는 키가 두 개이고 느려요. DES는 비밀키 암호예요.');
Q('b37','2-8','보기','공개키 암호 기법에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',BK5,3,
'ㄴ이 함정이에요. 공개키 암호는 비밀키 암호보다 느려요.','ㄱ. 공개키는 누구에게 공개되어도 된다.<br>ㄴ. 비밀키 암호보다 암호화·복호화 속도가 빠르다.<br>ㄷ. 비대칭키 암호라고도 한다.');
Q('b38','2-8','적용','공개키 암호를 "누구나 편지를 넣을 수 있지만 우체부만 열쇠로 열 수 있는 우체통"에 비유할 때, 편지를 넣는 투입구에 해당하는 것은?',['개인키','공개키','암호문','평문','해시값'],2,'누구나 쓸 수 있는 투입구가 공개키, 우체부만 가진 열쇠가 개인키예요.');
Q('b39','2-9','개념','해시에 대한 설명으로 옳은 것은?',['암호문을 평문으로 쉽게 복원할 수 있다.','다양한 길이의 데이터를 고정된 길이의 값으로 변환한다.','같은 입력이라도 매번 다른 값이 나온다.','두 개의 키를 사용한다.','문자의 위치를 이동시킨다.'],2,'해시는 단방향이라 복원이 불가능하고, 같은 입력이면 항상 같은 값이 나와요.');
Q('b40','2-9','개념','해시 함수가 "단방향"이라는 것의 의미로 옳은 것은?',['평문 → 해시값 변환은 가능하지만 해시값 → 평문은 불가능하다.','해시값 → 평문은 가능하지만 평문 → 해시값은 불가능하다.','양쪽 방향 모두 가능하다.','양쪽 방향 모두 불가능하다.','키만 있으면 해시값을 평문으로 되돌릴 수 있다.'],1,'믹서기처럼 과일 → 주스는 되지만 주스 → 과일은 안 돼요. 키가 있어도 마찬가지예요.');

const CZ=`<pre class="code">def caesar_cipher(plaintext, shift):
    alphabet = 'abcdefghijklmnopqrstuvwxyz'
    plaintext = plaintext.lower()
    ciphertext = ''
    for char in plaintext:
        if char not in alphabet:
            ciphertext = ciphertext + char
        else:
            idx = alphabet.index(char)
            idx = (idx + shift) % len(alphabet)
            ciphertext = ciphertext + alphabet[idx]
    return ciphertext

E('상','e33','1-6','보기','반복 길이 압축과 허프만 압축을 비교한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?',['ㄱ','ㄷ','ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄷ'],5,'셋 다 맞아요. ABAB처럼 연속 반복이 없으면 반복 길이 압축은 오히려 길어지지만, 허프만은 빈도수만 보니까 순서와 상관없어요.','ㄱ. 반복 길이 압축은 같은 문자가 "연속"될 때 효과가 크다.<br>ㄴ. 허프만 압축은 문자가 연속되지 않아도 빈도수 차이가 크면 효과가 있다.<br>ㄷ. 두 기법 모두 비손실 압축이다.');

 <div class="xblk tipb"><div class="xh">선생님 한마디</div><p>${esc(q.e)}</p></div>
 ${q.k?`<div class="xone"><b>딱 한 줄</b>${esc(q.k)}</div>`:''}</div>`}


/* ===== 로그인·동기화 (VOCAP과 같은 Firebase 프로젝트, 구글 로그인) ===== */
const FB_CONFIG={apiKey:"AIzaSyBX63hV8FnrkrtAuh9644yw4BSV2GTUPv4",authDomain:"vocap-e3e9e.firebaseapp.com",projectId:"vocap-e3e9e",storageBucket:"vocap-e3e9e.firebasestorage.app",messagingSenderId:"322645613396",appId:"1:322645613396:web:9b73e58558018c972fc6c1"};
const SY={user:null,busy:false,err:null,timer:null,last:null};
try{SY.last=localStorage.getItem('bitnote:synced')}catch(e){}
function fbOK(){return !!(window.firebase&&firebase.initializeApp)}
function canLogin(){return location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)}
function localAt(){try{return +(localStorage.getItem('bitnote:localAt')||0)}catch(e){return 0}}
const _save=save;save=function(){_save();try{localStorage.setItem('bitnote:localAt',String(Date.now()))}catch(e){}queuePush()};
function queuePush(){if(!SY.user)return;clearTimeout(SY.timer);SY.timer=setTimeout(pushNow,1500)}
/* 규칙을 안 바꿔도 되게: VOCAP이 이미 허락받은 users/내아이디 아래 자리를 차례로 시도 */
const PATHS=[u=>'users/'+u+'/apps/bitnote',u=>'users/'+u+'/push/bitnote'];
try{SY.pi=+(localStorage.getItem('bitnote:pathIdx')||0)}catch(e){SY.pi=0}
function fdoc(){return firebase.firestore().doc(PATHS[Math.min(SY.pi,PATHS.length-1)](SY.user.uid))}
async function tryPaths(fn){for(;;){try{return await fn()}catch(e){if(e.code==='permission-denied'&&SY.pi<PATHS.length-1){SY.pi++;try{localStorage.setItem('bitnote:pathIdx',String(SY.pi))}catch(_){}continue}throw e}}}
function pack(){const {theme,fs,...rest}=S;return JSON.stringify(rest)}
async function pushNow(){if(!SY.user)return;SY.busy=true;try{const at=Date.now();await tryPaths(()=>fdoc().set({app:'bitnote',data:pack(),updatedAt:at}));SY.last=String(at);localStorage.setItem('bitnote:synced',SY.last);SY.err=null}catch(e){SY.err='올리기 실패: '+(e.code||e.message)}SY.busy=false;refreshAcct()}
function mergeIn(r){
 const L=S.log;Object.entries(r.log||{}).forEach(([k,v])=>{if(!L[k]||(v.n||0)>(L[k].n||0))L[k]=v});
 S.wrong=[...new Set([...(S.wrong||[]),...(r.wrong||[])])].filter(id=>!(S.log[id]&&S.log[id].last));
 S.seen={...(r.seen||{}),...S.seen};
 if(!S.lastL&&r.lastL)S.lastL=r.lastL;}
async function pullNow(){if(!SY.user)return;SY.busy=true;refreshAcct();try{const d=await tryPaths(()=>fdoc().get());
 if(d.exists){const r=JSON.parse(d.data().data||'{}');mergeIn(r);_save();if(V.v!=='play')render()}
 await pushNow();toast('기록을 맞췄어요')}catch(e){SY.err='불러오기 실패: '+(e.code||e.message)}SY.busy=false;refreshAcct()}
async function login(){if(!fbOK()){toast('인터넷 연결을 확인해 주세요');return}
 if(!canLogin()){toast('설치한 앱(GitHub 주소)에서 로그인할 수 있어요');return}
 const pv=new firebase.auth.GoogleAuthProvider();
 try{await firebase.auth().signInWithPopup(pv)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))firebase.auth().signInWithRedirect(pv);else if(e.code!=='auth/popup-closed-by-user'){SY.err='로그인 실패: '+(e.code||e.message);refreshAcct()}}}
async function logout(){if(!confirm('로그아웃할까요? 이 기기 기록은 그대로 남아요.'))return;await firebase.auth().signOut();SY.user=null;refreshAcct()}
function ago(t){if(!t)return'아직 안 함';const s=Math.round((Date.now()-+t)/1000);return s<60?'방금':s<3600?Math.floor(s/60)+'분 전':s<86400?Math.floor(s/3600)+'시간 전':Math.floor(s/86400)+'일 전'}
function refreshAcct(){if(V.v==='set')render();const a=document.getElementById('acct');if(a)a.innerHTML=acctMini()}
function acctMini(){const u=SY.user;return u&&u.photoURL?`<img src="${esc(u.photoURL)}" alt="">`:`<span>${u?esc((u.displayName||'민')[0]):ic('user',20)}</span>`}
ICON.user='<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/>';
ICON.dl='<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>';
ICON.cloud='<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.5 4.3 4.3 0 0 0 7 18z"/>';
function acctCard(){const u=SY.user;
 if(!u)return`<div class="acc"><div class="av">${ic('user',22)}</div><div class="mid"><b>로그인하면 폰·패드 동기화</b><small>${canLogin()?'VOCAP·finale와 같은 구글 계정으로 들어가요':'설치한 앱에서 로그인할 수 있어요'}</small></div><button class="gbtn sm" onclick="login()">구글 로그인</button></div>${SY.err?`<p class="kol" style="color:var(--bad)">${esc(SY.err)}</p>`:''}`;
 return`<div class="acc">${u.photoURL?`<img class="av" src="${esc(u.photoURL)}" alt="">`:`<div class="av">${esc((u.displayName||'민')[0])}</div>`}<div class="mid"><b>${esc(u.displayName||'민서')}</b><small>${SY.busy?'맞추는 중…':'동기화 켜짐 · '+ago(SY.last)}</small></div></div>
 <div class="row" style="margin-top:10px"><button class="obtn" onclick="pullNow()">${ic('cloud',18)} 지금 맞추기</button><button class="obtn" onclick="logout()">로그아웃</button></div>${SY.err?`<p class="kol" style="color:var(--bad)">${esc(SY.err)}</p>`:''}`}
let INSTALL=null;addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();INSTALL=ev;if(V.v==='set')render()});
addEventListener('appinstalled',()=>{INSTALL=null;toast('앱으로 설치됐어요');if(V.v==='set')render()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function installCard(){if(standalone())return`<div class="acc"><img class="av sq" src="icon-192.png" alt=""><div class="mid"><b>앱으로 쓰는 중이에요</b><small>홈 화면 bitnote 아이콘으로 열면 돼요</small></div></div>`;
 if(INSTALL)return`<button class="acc" style="width:100%;text-align:left" onclick="INSTALL.prompt();INSTALL.userChoice.then(()=>{INSTALL=null;render()})"><img class="av sq" src="icon-192.png" alt=""><span class="mid"><b>앱으로 설치하기</b><small>홈 화면에 bitnote 아이콘이 생겨요</small></span><span class="pill">설치</span></button>`;
 return`<div class="acc"><div class="av">${ic('dl',22)}</div><div class="mid"><b>앱 설치</b><small>${canLogin()?'크롬 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"':'GitHub 주소로 열면 설치 버튼이 생겨요'}</small></div></div>`}
const _vSet=vSet;vSet=function(){_vSet();const h=app.querySelector('h1.t').nextElementSibling;h.insertAdjacentHTML('afterend',`<div class="lab">계정</div>${acctCard()}<div class="lab">앱</div>${installCard()}`)};
function initSync(){if(!fbOK())return;try{firebase.initializeApp(FB_CONFIG);firebase.auth().getRedirectResult().catch(e=>{SY.err='로그인 실패: '+(e.code||e.message)});
 firebase.auth().onAuthStateChanged(u=>{SY.user=u;refreshAcct();if(u)pullNow()})}catch(e){SY.err=String(e.message||e)}}
initSync();
if('serviceWorker' in navigator&&canLogin()){navigator.serviceWorker.register('sw.js',{scope:'./'}).then(r=>r.update()).catch(()=>{})}
/* 헤더 계정 버튼 */
(function(){const b=document.querySelector('.hb');if(b){b.insertAdjacentHTML('beforebegin',`<button class="hb av2" id="acct" onclick="go('set')" aria-label="계정">${acctMini()}</button>`)}})();

</script>
